[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-bot"
version = "0.1.0"
description = "AI-assisted Java/Python PR reviewer"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "unidiff>=0.7",
  "code-review-graph==2.4.0",
]

[project.scripts]
crb = "code_review_bot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
