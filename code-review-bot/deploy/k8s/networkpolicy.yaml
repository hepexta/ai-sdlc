apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: code-review-bot
  namespace: code-review-bot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: code-review-bot
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
