# One Job per PR. Inject the real PR URL and LLM endpoint from CI; do not
# commit secret values here. The image entrypoint is `tini -- crb`.
apiVersion: batch/v1
kind: Job
metadata:
  name: code-review-bot
  namespace: code-review-bot
  labels:
    app.kubernetes.io/name: code-review-bot
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1500
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-review-bot
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      serviceAccountName: code-review-bot
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: review
          image: ghcr.io/acme/code-review-bot:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["review"]
          env:
            - name: PR_URL
              value: "https://github.com/OWNER/REPO/pull/0"
            - name: LLM_BASE_URL
              value: "https://llm.example/v1"
            - name: LLM_MODEL_SENIOR
              value: "reviewer-fast"
            - name: LLM_MODEL_PRINCIPAL
              value: "reviewer-strong"
            - name: LLM_MODEL_SECURITY
              value: "reviewer-strong"
            - name: LLM_API_KEY_FILE
              value: /run/secrets/llm_api_key
            - name: GITHUB_TOKEN_FILE
              value: /run/secrets/github_token
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: GRAPH_MODE
              value: auto
            - name: GRAPH_MCP
              value: "off"
            - name: SECURITY_PASS
              value: auto
            - name: AI_REVIEWED_LABEL
              value: "AI Reviewed"
            - name: FAIL_ON
              value: none
            - name: EFFORT_MODE
              value: variant
            - name: OUTPUT_DIR
              value: /out
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: out
              mountPath: /out
            - name: graph-cache
              mountPath: /cache/code-review-graph
      volumes:
        - name: secrets
          secret:
            secretName: code-review-bot-secrets
        - name: tmp
          emptyDir: {}
        - name: out
          emptyDir: {}
        - name: graph-cache
          emptyDir: {}
