# Vault KV v2 is the source of truth. ESO syncs the two values into the
# derived Secret mounted by the Job. The pod never receives a Vault token.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: code-review-bot-secrets
  namespace: code-review-bot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-local
    kind: ClusterSecretStore
  target:
    name: code-review-bot-secrets
    creationPolicy: Owner
  data:
    - secretKey: llm_api_key
      remoteRef:
        key: agents-infra/local/code-review-bot
        property: llm_api_key
    - secretKey: github_token
      remoteRef:
        key: agents-infra/local/code-review-bot
        property: github_token
